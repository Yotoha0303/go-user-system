apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-user-system
  namespace: go-user-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-user-system
  template:
    metadata:
      labels:
        app: go-user-system
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8082"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/yotoha0303/go-user-system-backend:v1.0.0-rc.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: go-user-system-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: go-user-system-secret
                  key: JWT_SECRET
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: go-user-system-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: go-user-system-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: go-user-system-config
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: go-user-system-config
                  key: DB_NAME
            - name: REGISTRATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: go-user-system-config
                  key: REGISTRATION_ENABLED
            - name: REDIS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: go-user-system-config
                  key: REDIS_ENABLED
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: go-user-system-config
                  key: REDIS_ADDR
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: go-user-system-config
                  key: APP_ENV
            - name: COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: go-user-system-config
                  key: COOKIE_SECURE
            - name: TRUSTED_PROXIES
              valueFrom:
                configMapKeyRef:
                  name: go-user-system-config
                  key: TRUSTED_PROXIES
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /app/config.yml
              subPath: config.yml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: go-user-system-config
