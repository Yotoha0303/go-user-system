apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-user-system-ingress
  namespace: go-user-system
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: go-user-system
            port:
              number: 8082
      - path: /
        pathType: Prefix
        backend:
          service:
            name: go-user-system-frontend
            port:
              number: 80
