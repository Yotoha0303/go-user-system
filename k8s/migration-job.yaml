apiVersion: batch/v1
kind: Job
metadata:
  name: go-user-system-migrate-v1-0-0-rc-3
  namespace: go-user-system
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: go-user-system-migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/yotoha0303/go-user-system-backend:v1.0.0-rc.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if command -v goose >/dev/null 2>&1; then
                exec goose -dir /app/migrations mysql \
                  "${DB_USER}:${DB_PASSWORD}@tcp(${DB_HOST}:${DB_PORT})/${DB_NAME}?parseTime=true&multiStatements=true" up
              fi
              exec /app/go-user-system migrate up
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: go-user-system-secret
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: go-user-system-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: go-user-system-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: go-user-system-config
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: go-user-system-config
                  key: DB_NAME
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
