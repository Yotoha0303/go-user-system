# mysql.yaml — in-cluster MySQL for go-user-system
# Service name MUST match configmap mysql.host: go-user-system-mysql
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: go-user-system-mysql-pvc
  namespace: go-user-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-user-system-mysql
  namespace: go-user-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-user-system-mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: go-user-system-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: go-user-system-secret
                  key: DB_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: go_user_system
            - name: MYSQL_USER
              value: go_user_system
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: go-user-system-secret
                  key: DB_PASSWORD
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: go-user-system-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: go-user-system-mysql
  namespace: go-user-system
spec:
  selector:
    app: go-user-system-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
  type: ClusterIP
