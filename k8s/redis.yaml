apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: go-user-system-redis-data
  namespace: go-user-system
  labels:
    app: go-user-system-redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-user-system-redis
  namespace: go-user-system
  labels:
    app: go-user-system-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-user-system-redis
  template:
    metadata:
      labels:
        app: go-user-system-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: go-user-system-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: go-user-system-redis
  namespace: go-user-system
  labels:
    app: go-user-system-redis
spec:
  selector:
    app: go-user-system-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
