name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test backend
        run: go test ./...
      - name: Check frontend
        working-directory: frontend
        run: npm ci && npm run check

  images:
    name: Publish ${{ matrix.component }} image
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        include:
          - component: backend
            context: .
            image: ghcr.io/yotoha0303/go-user-system-backend
          - component: frontend
            context: ./frontend
            image: ghcr.io/yotoha0303/go-user-system-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Prepare build metadata
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build.outputs.build_time }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [verify, images]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X go-user-system/internal/buildinfo.Version=${VERSION} -X go-user-system/internal/buildinfo.Commit=${GITHUB_SHA} -X go-user-system/internal/buildinfo.BuildTime=${BUILD_TIME}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/go-user-system ./cmd
          tar -C dist -czf "dist/go-user-system_${VERSION}_linux_amd64.tar.gz" go-user-system
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/go-user-system ./cmd
          tar -C dist -czf "dist/go-user-system_${VERSION}_linux_arm64.tar.gz" go-user-system
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/go-user-system.exe ./cmd
          (cd dist && zip "go-user-system_${VERSION}_windows_amd64.zip" go-user-system.exe)
          rm dist/go-user-system dist/go-user-system.exe
          npm ci --prefix frontend
          npm run build --prefix frontend
          tar -C frontend/dist -czf "dist/go-user-system-frontend_${VERSION}.tar.gz" .
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
