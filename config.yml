environment: development
server:
  port: 8082
mysql:
  host: 127.0.0.1
  port: "3306"
  user: root
  database: go_user_system
  maxOpenConns: 10
  maxIdleConns: 5
  connMaxLifeTime: 30m
  connMaxIdleTime: 5m
  pingTimeout: 3s
redis:
  enabled: false
  address: 127.0.0.1:6379
  db: 0
  dialTimeout: 3s
  readTimeout: 2s
  writeTimeout: 2s
  pingTimeout: 3s
jwt:
  expireHours: 24
  accessTokenExpireMinutes: 15
  refreshTokenExpireHours: 168
auth:
  refreshCookie:
    secure: false
  registration:
    enabled: true
  loginRateLimit:
    accountLimit: 5
    ipLimit: 20
    window: 15m
http:
  trustedProxies: []
  server:
    readTimeout: 5s
    writeTimeout: 10s
    idleTimeout: 60s
    readHeaderTimeout: 2s
    maxHeaderBytesKib: 128
    timeout: 5s
