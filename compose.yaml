name: go-user-system

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: go_user_system
      MYSQL_USER: go_user_system
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-dev}
        COMMIT: ${APP_COMMIT:-unknown}
        BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    image: go-user-system-backend:dev
    command: ["migrate", "up"]
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: go_user_system
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: go_user_system
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-dev}
        COMMIT: ${APP_COMMIT:-unknown}
        BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    image: go-user-system-backend:dev
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8082}:8082"
    environment:
      APP_ENV: development
      APP_PORT: "8082"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: go_user_system
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: go_user_system
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      REDIS_ENABLED: "true"
      REDIS_ADDR: redis:6379
      COOKIE_SECURE: "false"
      TRUSTED_PROXIES: "172.30.0.0/24"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-dev}
        COMMIT: ${APP_COMMIT:-unknown}
        BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    image: go-user-system-frontend:dev
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
